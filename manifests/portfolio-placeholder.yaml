# Site content is baked into the image at build time by a separate app repo
# (github.com/nthedition/jonferrer-site-portfolio) — this Deployment just
# references the resulting image by tag. Bumping the tag below (after that
# repo's CI publishes a new one) is now the entire "deploy a content change"
# workflow; see that repo's README for how the image gets built.
#
# TODO: replace this placeholder tag with the real one from the first
# successful build in jonferrer-site-portfolio's build-and-push workflow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-site
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-site
  template:
    metadata:
      labels:
        app: portfolio-site
    spec:
      containers:
        - name: nginx
          image: ghcr.io/nthedition/jonferrer-site-portfolio:4d4df09fbd869df195ddc1ea9d79a18a9047a268
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-site
  namespace: portfolio
spec:
  selector:
    app: portfolio-site
  ports:
    - port: 80
      targetPort: 80
