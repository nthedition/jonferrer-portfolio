# The portfolio-html ConfigMap referenced below is generated by Kustomize's
# configMapGenerator (see kustomization.yaml) from ../site/index.html — not
# defined here. Kustomize appends a content hash to the generated name and
# rewrites this Deployment's volume reference to match automatically, so
# every real content change produces a new ConfigMap name and forces a
# rolling pod update — no manual restart, no waiting on kubelet's sync delay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-site
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-site
  template:
    metadata:
      labels:
        app: portfolio-site
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: portfolio-html
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-site
  namespace: portfolio
spec:
  selector:
    app: portfolio-site
  ports:
    - port: 80
      targetPort: 80
