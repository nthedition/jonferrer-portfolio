# Defines the identity the `apps` Kustomization reconciles as (see
# clusters/oci-k8s-study/apps.yaml's spec.serviceAccountName), scoped down
# from the cluster-admin default to exactly what `apps` manages:
# Deployment/Service/Ingress in `portfolio`, nothing else. This file itself
# is applied by `infrastructure` (the broader-permissioned Kustomization,
# same reasoning as namespace.yaml/traefik-acme-config.yaml living here) --
# defining a scoped Role inherently requires broader rights than the scoped
# identity ends up with.
#
# The ServiceAccount lives in `flux-system`, NOT `portfolio` -- Flux
# resolves a Kustomization's serviceAccountName in the same namespace as
# the Kustomization object itself (apps.yaml lives in flux-system), not the
# namespace it's deploying into. Getting this backwards produces a
# `system:serviceaccount:flux-system:apps-reconciler` identity that doesn't
# exist and gets a blanket Forbidden on everything -- confirmed the hard
# way once already, don't move this back to `portfolio`. The Role/
# RoleBinding still live in `portfolio` (where the resources actually are),
# with the RoleBinding's subject pointing cross-namespace at the
# flux-system ServiceAccount -- the same "subject namespace can differ from
# RoleBinding namespace" mechanism used for the (now-removed) monitoring
# grant, just applied in the other direction.
#
# The Grafana Secret (infrastructure/monitoring/grafana-secret.enc.yaml) and
# the Namespace/HelmChartConfig above are all reconciled by `infrastructure`
# directly now, not by `apps` -- so apps-reconciler no longer needs any
# cross-namespace grant at all, just this one namespace-scoped Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apps-reconciler
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apps-reconciler
  namespace: portfolio
rules:
  - apiGroups: ["", "apps", "networking.k8s.io"]
    resources: ["deployments", "services", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apps-reconciler
  namespace: portfolio
subjects:
  - kind: ServiceAccount
    name: apps-reconciler
    namespace: flux-system
roleRef:
  kind: Role
  name: apps-reconciler
  apiGroup: rbac.authorization.k8s.io
