# k3s ships Traefik as the default ingress controller (ingressClassName: traefik),
# exposed on every node's host ports 80/443 via k3s's built-in ServiceLB -
# no cloud LoadBalancer needed, matches the Always Free / no-extra-cost goal.
#
# TLS via Traefik's ACME (Let's Encrypt) support, configured cluster-wide in
# infrastructure/traefik-acme-config.yaml. No tls.secretName below is intentional -
# with a certresolver annotation, Traefik issues/renews the cert itself via
# ACME and keeps it in its own persistent acme.json, rather than a k8s Secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-site
  namespace: portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jonrferrer.duckdns.org
  rules:
    - host: jonrferrer.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-site
                port:
                  number: 80
