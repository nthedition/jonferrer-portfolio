# Site content is baked into the image at build time by a separate app repo
# (github.com/nthedition/jonferrer-site-portfolio) — this Deployment just
# references the resulting image by tag. The tag below is now managed by
# Flux's image-automation-controller (see infrastructure/image-automation/)
# -- it rewrites the line in place on every new build, committing back to
# git automatically. The `$imagepolicy` marker comment is required by that
# controller's "Setters" update strategy; don't remove it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-site
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-site
  template:
    metadata:
      labels:
        app: portfolio-site
    spec:
      containers:
        - name: nginx
          image: ghcr.io/nthedition/jonferrer-site-portfolio:1-4d4df09fbd869df195ddc1ea9d79a18a9047a268 # {"$imagepolicy": "flux-system:portfolio-site"}
          ports:
            - containerPort: 80
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
