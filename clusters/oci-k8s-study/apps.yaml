# Thin pointer at the app-tier manifests (apps/portfolio-site/) -- reuses the
# GitRepository source Flux's own bootstrap already created
# (flux-system/flux-system). Reconciles as the scoped apps-reconciler
# identity (see infrastructure/rbac.yaml) rather than the cluster-admin
# default; no decryption block needed here since apps/portfolio-site holds
# no encrypted secrets (those live under infrastructure/ now).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/portfolio-site
  prune: true
  serviceAccountName: apps-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
