# Deploys everything at the repo root (the portfolio site, ingress, and
# Traefik ACME config — see /kustomization.yaml) by reusing the GitRepository
# source Flux's own bootstrap already created (flux-system/flux-system).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
